# Production route for the 2.3 online service.
# TLS termination stays in Nginx; only the loopback rootless port is proxied.
server {
    listen 443 ssl;
    server_name play.327802521.xyz;
    ssl_certificate /etc/nginx/ssl/327802521.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/327802521.xyz/privkey.pem;
    access_log off;

    location = /ws {
        proxy_pass http://127.0.0.1:19643;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}